<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Whispers Before the Silence: Shadows Over Blackthorn Manor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="title-active">
    <div id="app">
        <div id="title-screen" role="dialog" aria-labelledby="title-series" aria-modal="true">
            <div class="title-screen-inner">
                <h1 id="title-series" class="title-series">Whispers Before the Silence</h1>
                <p id="title-episode" class="title-episode">Shadows Over Blackthorn Manor</p>
                <div class="title-actions">
                    <button type="button" id="title-begin-btn" class="title-btn title-btn-primary">Begin Investigation</button>
                    <button type="button" id="title-continue-btn" class="title-btn title-btn-secondary hidden">Continue</button>
                </div>
            </div>
        </div>

        <div id="game-container">
            <header id="game-header">
                <div class="header-text">
                    <div id="game-title">Whispers Before the Silence</div>
                    <div id="episode-title">Shadows Over Blackthorn Manor</div>
                </div>
            </header>
            
            <div id="game-stats" class="desktop-stats">
                <div class="desktop-stats-left">
                    <div id="time-remaining">Time: <span id="time-value-desktop">20</span></div>
                    <div id="suspicion-level">Suspicion: <span id="suspicion-value-desktop">0</span></div>
                </div>
                <button type="button" id="desktop-settings-btn" class="desktop-settings-btn" data-panel="settings">Settings</button>
            </div>
            
            <main id="game-content">
                <div id="room-stage" class="room-stage" aria-hidden="false">
                    <div class="room-stage-frame">
                        <img id="room-stage-image" class="room-image" alt="" />
                    </div>
                    <div id="room-stage-name" class="location"></div>
                </div>
                <div id="scene-scroll">
                    <div id="scene-narrative"></div>
                    <div id="choices-container"></div>
                </div>
                <!-- Legacy id kept for ending/fallback scripts -->
                <div id="scene-display" class="sr-only" aria-hidden="true"></div>
            </main>
            
            <aside id="journal-sidebar" class="desktop-sidebar">
                <div id="journal-header">Clue Journal</div>
                <div id="journal-content"></div>
                <div id="profiles-header" style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border-subtle);">Character Profiles</div>
                <div id="profiles-content"></div>
            </aside>
        </div>

        <nav id="mobile-bottom-bar" class="mobile-bottom-bar" aria-label="Status">
            <div class="bottom-stats" aria-live="polite">
                <span class="bottom-stat">Time <strong id="time-value">20</strong></span>
                <span class="bottom-stat">Suspicion <strong id="suspicion-value">0</strong></span>
            </div>
            <div class="bottom-menu">
                <button type="button" id="bottom-menu-toggle" class="bottom-menu-toggle" aria-expanded="false" aria-controls="bottom-menu-panel" aria-haspopup="true">
                    Menu
                </button>
                <div id="bottom-menu-panel" class="bottom-menu-panel" hidden role="menu">
                    <button type="button" class="bottom-menu-item" role="menuitem" data-panel="journal">Journal</button>
                    <button type="button" class="bottom-menu-item" role="menuitem" data-panel="profiles">Characters</button>
                    <button type="button" class="bottom-menu-item" role="menuitem" data-panel="settings">Settings</button>
                </div>
            </div>
        </nav>
        
        <div id="mobile-panel-overlay" class="mobile-panel-overlay hidden">
            <div id="mobile-panel" class="mobile-panel">
                <button id="panel-close" class="panel-close" aria-label="Close">×</button>
                <div id="panel-content"></div>
            </div>
        </div>
        
        <div id="modal-overlay" class="hidden">
            <div id="modal-content">
                <div id="modal-text"></div>
                <div id="modal-actions"></div>
            </div>
        </div>
    </div>
    
    <script type="module" src="/main.js"></script>
</body>
</html>
